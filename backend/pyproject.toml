[project]
name = "genomixai-backend"
version = "0.1.0"
description = "GenomixAI clinical decision support backend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]
test = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
per-file-ignores = {"app/core/authorization.py" = ["B008"], "app/api/clinical.py" = ["B008"], "app/api/patients.py" = ["B008"], "app/api/timeline.py" = ["B008"], "app/api/medications.py" = ["B008"]}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
